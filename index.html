<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? - 저녁 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-btn">다크 모드</button>
    </div>
    <main class="container">
        <div class="card">
            <h1>🍴 오늘 뭐 먹지?</h1>
            <div class="menu-display">
                <span id="recommended-menu">메뉴를 골라보세요!</span>
            </div>
            <button class="btn" id="generate-btn">메뉴 추천받기</button>
        </div>

        <div class="card contact-card">
            <h2>🤝 제휴 및 메뉴 추가 문의</h2>
            <form action="https://formspree.io/f/mojrkyyl" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" placeholder="추가하고 싶은 메뉴나 제휴 문의를 남겨주세요." required></textarea>
                </div>
                <button type="submit" class="btn">메시지 보내기</button>
            </form>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
