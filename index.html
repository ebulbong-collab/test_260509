<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트 - 나는 어떤 동물과 닮았을까?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div class="top-bar">
        <div class="lang-switch">
            <a href="index.html" class="active">KO</a> | <a href="en.html">EN</a>
        </div>
        <div class="theme-toggle">
            <button id="theme-btn">다크 모드</button>
        </div>
    </div>
    <main class="container">
        <div class="card">
            <h1>🐶 동물상 테스트</h1>
            <p class="subtitle">AI가 분석하는 나의 동물상</p>
            
            <div id="upload-area" class="test-area">
                <div id="webcam-container"></div>
                <img id="image-preview" style="display:none;" />
                <div id="placeholder-text">
                    <p>카메라를 켜거나 사진을 업로드하세요</p>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn" id="webcam-btn">📸 카메라 시작</button>
                <label for="file-upload" class="btn outline-btn">
                    📁 사진 업로드
                    <input type="file" id="file-upload" accept="image/*" style="display:none;">
                </label>
            </div>
            
            <div id="result-container" style="display:none;">
                <h2 id="result-title">분석 결과</h2>
                <div id="label-container"></div>
                <button class="btn secondary-btn" id="reset-btn">다시 하기</button>
            </div>
        </div>

        <div class="card contact-card">
            <h2>🤝 제휴 및 문의</h2>
            <form action="https://formspree.io/f/mojrkyyl" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" placeholder="문의 사항을 남겨주세요." required></textarea>
                </div>
                <button type="submit" class="btn">메시지 보내기</button>
            </form>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
